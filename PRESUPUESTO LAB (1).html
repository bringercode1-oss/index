<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PRESUPUESTO LAB</title>
<style>
:root{--bg:#f6f7f9;--fg:#1b2330;--card:#fff;--bd:#d5dbe3;--ac:#1f5fbf;--ok:#0b7a3b;--er:#b3261e;--mu:#5a6678;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161d;--fg:#e6eaf0;--card:#1b212b;--bd:#323b49;--ac:#7fb0ff;--ok:#4cc57f;--er:#ff8a80;--mu:#9aa6b8;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12161d;--fg:#e6eaf0;--card:#1b212b;--bd:#323b49;--ac:#7fb0ff;--ok:#4cc57f;--er:#ff8a80;--mu:#9aa6b8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}header b{font-size:18px;margin-right:12px}nav{display:flex;flex-wrap:wrap;gap:6px;flex:1}
button,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac)}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) button{color:#0b1220}}
button.s{background:var(--card);color:var(--fg);border-color:var(--bd)}button.on{outline:2px solid var(--fg)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}.card h3{margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{border:1px solid var(--bd);padding:4px 6px}th{background:var(--bg);font-size:13px}
td input{width:100%;box-sizing:border-box;min-width:92px;text-align:right}td.l{white-space:nowrap}.lock{text-align:center;color:var(--mu);background:var(--bg)}
input.ok{border-color:var(--ok);background:rgba(11,122,59,.14)}input.er{border-color:var(--er);background:rgba(179,38,30,.14)}
pre{white-space:pre-wrap;overflow-x:auto;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;margin:10px 0 0}details{margin:4px 0 8px}summary{cursor:pointer;color:var(--ac)}.mu{color:var(--mu)}b#sc{margin-left:6px}
</style></head><body>
<header><b>PRESUPUESTO LAB</b><nav><button class="s on" data-t="P">Problema</button><button class="s" data-t="C">Cédulas</button><button class="s" data-t="A">Aprender</button></nav></header>
<main><section id="tP"></section><section id="tC" hidden></section><section id="tA" hidden></section></main>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),f=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2}),sum=a=>a.reduce((x,y)=>x+y,0);
const GN=['Depreciación','Supervisión','Seguro','Mantenimiento','Accesorios','Energéticos'],AN=['Sueldos','Comisiones','Publicidad','Accesorios','Depreciación','Varios'];
const P1={n:'Ejercicio 1',pt:250000,AA:[5,7],BB:[3,3],H:[4,7],w:[25,29],mp:{AA:[1200,2500,15,17],BB:[700,2000,12,14]},fp:{Z:[150,300],Y:[220,350]},pr:{Z:[500,600],Y:[320,360]},sv:{Z:[4000,5000],Y:[2800,3200]},g:[190000,750000,385000,270000,150000,170000],a:[250000,70000,210000,55000,50000,80000]};
const P2={n:'Ejercicio 2',pt:20000,AA:[10,6],BB:[5,0],H:[3,1],w:[10,12],mp:{AA:[2000,3000,4,5],BB:[500,650,3,3.5]},fp:{Z:[100,50],Y:[200,80]},pr:{Z:[170,175],Y:[100,101]},sv:{Z:[10000,13000],Y:[20000,25000]},g:[100000,400000,85000,115000,10000,100000],a:[120000,50000,100000,5000,35000,5000]};
// inventario inicial e inventario final: a veces sube y a veces baja
const d=(a,b)=>{const x=R(a,b),up=Math.random()<.5;return[x,Math.max(1,Math.round(x*(up?1+R(15,70)/100:1-R(15,50)/100)))]};
const cc=(a,b)=>{const x=R(a*2,b*2)/2;return[x,x+R(0,6)/2]};
function gen(){const w=R(8,30),pz=R(100,600),py=R(60,350);return{n:'Aleatorio',pt:R(15,300)*1000,AA:[R(3,12),R(2,9)],BB:[R(1,6),R(1,5)],H:[R(1,8),R(1,8)],w:[w,w+R(1,5)],
mp:{AA:[...d(800,3000),...cc(3,18)],BB:[...d(400,2000),...cc(2,14)]},fp:{Z:d(100,400),Y:d(100,400)},pr:{Z:[pz,pz+R(2,60)],Y:[py,py+R(2,40)]},
sv:{Z:[R(2000,12000),R(2000,12000)],Y:[R(2000,12000),R(2000,12000)]},g:GN.map(()=>R(4000,16000)*10),a:AN.map(()=>R(2000,15000)*10)}}
function calc(p){const K=['Z','Y'],M=['AA','BB'],C=[[0,0],[0,1],[1,0],[1,1]],c={};
c.v=C.map(([s,k])=>p.sv[K[k]][s]);c.pc=C.map(([s,k])=>p.pr[K[k]][s]);c.t=c.v.map((v,i)=>v*c.pc[i]);
c.fi=C.map(([s,k])=>p.fp[K[k]][1]);c.ii=C.map(([s,k])=>p.fp[K[k]][s?1:0]);c.nec=c.v.map((v,i)=>v+c.fi[i]);c.pd=c.nec.map((v,i)=>v-c.ii[i]);
c.kg=M.map(x=>C.map(([s,k],i)=>c.pd[i]*p[x][k]));c.cp=(mi,s)=>p.mp[M[mi]][2+s];
c.rq=M.map((x,mi)=>[0,1].map(s=>c.kg[mi][s*2]+c.kg[mi][s*2+1]));
c.hr=C.map(([s,k],i)=>c.pd[i]*p.H[k]);c.mod=C.map(([s],i)=>c.hr[i]*p.w[s]);
c.G=sum(p.g);c.HH=sum(c.hr);c.cu=c.G/c.HH;c.ap=c.hr.map(h=>h*c.cu);
c.u=K.map((z,k)=>[[p.AA[k],c.cp(0,1)],[p.BB[k],c.cp(1,1)],[p.H[k],p.w[1]],[p.H[k],c.cu]]);
c.cu8=c.u.map(r=>sum(r.map(q=>q[0]*q[1])));c.ci=K.map((z,k)=>c.cu8[k]*p.fp[z][1]);c.GT=sum(c.ci);
c.mpu=sum(M.map((x,mi)=>sum(c.kg[mi].map((q,i)=>q*c.cp(mi,C[i][0])))));c.MOD=sum(c.mod);c.CP=c.mpu+c.MOD+c.G;c.CV=c.CP+p.pt-c.GT;
c.V=sum(c.t);c.UB=c.V-c.CV;c.GA=sum(p.a);c.U=c.UB-c.GA;return c}
const pad=(s,n)=>String(s).padEnd(n);
function txt(p){const r=(n,a)=>pad(n,24)+pad(a[0]+' Kg.',10)+a[1]+' Kg.',z=(n,a)=>pad(n,24)+pad(a[0],10)+a[1],k=(n,a)=>pad(n,24)+pad(a[0],10)+a[1];
const L=['Se pide preparar el presupuesto de operación para el 2027.','Inventario P.T.   '+f(p.pt),'','Requerimientos de los productos:',pad('Producto',24)+pad('Tipo Z',10)+'Tipo Y',r('Materia Prima AA',p.AA),r('Materia Prima BB',p.BB),pad('Horas Mano de Obra',24)+pad(p.H[0],10)+p.H[1],'',
'Los gastos indirectos de fabricación se aplican con base en horas de mano de obra directa. El costo de la mano de obra es de '+p.w[0]+' la hora para el primer semestre y '+p.w[1]+' para el segundo.','',
pad('',16)+pad('Inv. Inicial',14)+pad('Inv. Final',14)+pad('Costo',12)+'Costo',pad('',16)+pad('Unidades',14)+pad('deseado',14)+pad('1er SEM',12)+'2do. SEM'];
['AA','BB'].forEach(x=>{const m=p.mp[x];L.push(pad('Materia Prima '+x,16)+pad(f(m[0]),14)+pad(f(m[1]),14)+pad(m[2]+' x Kg.',12)+m[3]+' x Kg.')});
['Z','Y'].forEach(x=>L.push(pad('Tipo '+x,16)+pad(f(p.fp[x][0]),14)+f(p.fp[x][1])));
L.push('','Se desea tener la misma cantidad de inventario final de materia prima y de productos terminados en el almacén cada semestre.','',pad('',10)+pad('Precio Venta',20)+'Ventas Planeadas Unidades',pad('',10)+pad('1er SEM',10)+pad('2do SEM',10)+pad('1er SEM',10)+'2do SEM');
['Z','Y'].forEach(x=>L.push(pad('Tipo '+x,10)+pad(p.pr[x][0],10)+pad(p.pr[x][1],10)+pad(f(p.sv[x][0]),10)+f(p.sv[x][1])));
L.push('','Los inventarios en proceso tienen poca importancia para la elaboración del presupuesto.','','Los gastos indirectos de fabricación que se han estimado para 2027 son:');
GN.forEach((n,i)=>L.push(pad(n,16)+f(p.g[i])));L.push(pad('Total:',16)+f(sum(p.g)),'','Los gastos de administración y ventas que se han estimado para 2027 son:');
AN.forEach((n,i)=>L.push(pad(n,16)+f(p.a[i])));L.push(pad('Total:',16)+f(sum(p.a)));return L.join('\n')}
const T=(h,r)=>`<div class="scroll"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(w=>`<tr><td class="l">${w[0]}</td>${w.slice(1).map(v=>v===null?'<td class="lock">–</td>':`<td><input inputmode="decimal" data-e="${v}" aria-label="respuesta"></td>`).join('')}</tr>`).join('')}</table></div>`;
const H=(t,h,b)=>`<div class="card"><h3>${t}</h3><details><summary>Cómo se hace</summary><p>${h}</p></details>${b}</div>`;
const SM=['S1 Z','S1 Y','S2 Z','S2 Y'];
function ced(){const K=['Z','Y'],o=[];let s='';
o.push(H('1. Presupuesto de ventas','Unidades × precio, por semestre. El importe total es S1 + S2.',T(['Producto','S1 Unid.','S1 Precio','S1 Total','S2 Unid.','S2 Precio','S2 Total','Importe total'],[...K.map((z,k)=>['Producto '+z,c.v[k],c.pc[k],c.t[k],c.v[k+2],c.pc[k+2],c.t[k+2],c.t[k]+c.t[k+2]]),['Total',null,null,c.t[0]+c.t[1],null,null,c.t[2]+c.t[3],c.V]])));
o.push(H('2. Presupuesto de producción en unidades','Producción = ventas + inventario final deseado − inventario inicial. El inventario final puede ser mayor o menor que el inicial: si es mayor produces más de lo que vendes, si es menor produces menos. El inventario inicial del S2 es el final del S1.',T(['Concepto',...SM],[['Ventas presupuestadas',...c.v],['Inventario final deseado',...c.fi],['Necesidad de producción',...c.nec],['Inventario inicial',...c.ii],['Producción requerida',...c.pd]])));
[0,1].forEach(s=>{const a=s*2;
const kgAA=[0,1].map(k=>c.kg[0][a+k]),kgBB=[0,1].map(k=>c.kg[1][a+k]),cA=c.cp(0,s),cB=c.cp(1,s),sA=sum(kgAA),sB=sum(kgBB);
o.push(H('3. Requerimiento de materia prima — Semestre '+(s+1),'Producción requerida (cédula 2) × kg por unidad = kg totales de cada materia prima. Luego kg totales × costo por kg del semestre.',T(['Producto','Prod. req. AA','Cant. AA (kg)','Total AA (kg)','Prod. req. BB','Cant. BB (kg)','Total BB (kg)','Total semestre'],[...K.map((z,k)=>['Producto '+z,c.pd[a+k],P.AA[k],kgAA[k],c.pd[a+k],P.BB[k],kgBB[k],null]),['Total kg',null,null,sA,null,null,sB,sA+sB],['Costo/kg',null,null,cA,null,null,cB,null],['Gran total',null,null,sA*cA,null,null,sB*cB,sA*cA+sB*cB]])))});
const cols=[0,1,2,3].map(j=>{const s=j>>1,mi=j&1,IF=P.mp[['AA','BB'][mi]][1],II=s?IF:P.mp[['AA','BB'][mi]][0],rq=c.rq[mi][s];return[rq,IF,rq+IF,II,rq+IF-II,c.cp(mi,s),(rq+IF-II)*c.cp(mi,s)]});
o.push(H('4. Presupuesto de compras de materia prima','Compra = requerimiento + inventario final deseado − inventario inicial (el del S2 es el final del S1). Costo de la compra = kg a comprar × costo por kilo.',T(['Concepto','S1 AA','S1 BB','S2 AA','S2 BB'],['Requerimiento de MP (kg)','Inventario final deseado','Necesidad de compra','Inventario inicial','Total a comprar (kg)','Costo por kilo','Costo de la compra'].map((n,r)=>[n,...cols.map(x=>x[r])]))));
o.push(H('5. Presupuesto de mano de obra directa','Horas = producción requerida × horas por unidad. Costo = horas × costo por hora del semestre (el S2 tiene otra tarifa).',T(['Concepto',...SM,'Total'],[['Requerimiento de producción',...c.pd,null],['Horas requeridas por unidad',...[0,1,2,3].map(j=>P.H[j&1]),null],['Total horas requeridas',...c.hr,c.HH],['Costo por hora',...[0,1,2,3].map(j=>P.w[j>>1]),null],['Total costo MOD',...c.mod,c.MOD]])));
o.push(H('6. Gastos indirectos de fabricación (G.I.F.)','Cuota = total de G.I.F. ÷ total de horas de MOD (de los dos semestres). G.I.F. aplicado = horas × cuota. La suma de lo aplicado debe regresar al total de G.I.F.',T(['Concepto','Importe'],[...GN.map((n,i)=>[n,P.g[i]]),['Total G.I.F.',c.G],['Total horas de MOD',c.HH],['Cuota de G.I.F. por hora',c.cu],['G.I.F. aplicado S1',c.ap[0]+c.ap[1]],['G.I.F. aplicado S2',c.ap[2]+c.ap[3]]])+T(['Concepto',...SM,'Total'],[['Total horas requeridas',...c.hr,c.HH],['Cuota de G.I.F. por hora',null,null,null,null,c.cu],['G.I.F. aplicado',...c.ap,c.G]])));
o.push(H('7. Gastos de venta y administración','Solo se suman; no dependen de la producción.',T(['Concepto','Importe'],[...AN.map((n,i)=>[n,P.a[i]]),['Total',c.GA]])));
o.push(H('8. Valuación de inventarios finales','Costo unitario = kg × costo/kg + horas × tarifa MOD + horas × cuota de G.I.F., con los costos del S2 (el inventario final sale al último precio). Costo del inventario = costo unitario × unidades finales.',T(['Concepto','Z Cant.','Z Costo u.','Z Total','Y Cant.','Y Costo u.','Y Total'],[...['Materia prima AA','Materia prima BB','Mano de obra directa','Gastos indirectos fabricación'].map((n,r)=>[n,...[0,1].flatMap(k=>[c.u[k][r][0],c.u[k][r][1],c.u[k][r][0]*c.u[k][r][1]])]),['Costo unitario',null,null,c.cu8[0],null,null,c.cu8[1]],['Inventario final (unidades)',null,null,P.fp.Z[1],null,null,P.fp.Y[1]],['Costo inventario final',null,null,c.ci[0],null,null,c.ci[1]],['Gran total del inventario final',null,null,null,null,null,c.GT]])));
o.push(H('9. Estado de costos de producción presupuestado','Costo de producción = MP utilizada (total de la cédula 3, S1 + S2) + MOD + G.I.F. aplicado. Costo de ventas = costo de producción + inventario inicial P.T. − inventario final P.T. (cédula 8).',T(['Concepto','Lado izquierdo','Lado derecho'],[['Materia prima directa utilizada',c.mpu,null],['Mano de obra directa',c.MOD,null],['Gastos indirectos de fabricación',c.G,null],['Costo de producción',null,c.CP],['Inventario inicial de producto terminado',P.pt,null],['Inventario final de producto terminado',c.GT,null],['Costo de ventas presupuestado',null,c.CV]])));
o.push(H('10. Estado de resultados presupuestado','Ventas − costo de ventas = utilidad bruta. Utilidad bruta − gastos de venta y administración = utilidad del ejercicio.',T(['Concepto','Importe'],[['Ventas presupuestadas',c.V],['Costo de ventas',c.CV],['Utilidad bruta',c.UB],['Gastos de operación (venta y administración)',c.GA],['Utilidad del ejercicio',c.U]])));
return `<div class="card row"><button onclick="chk()">Revisar</button><button class="s" onclick="sol()">Ver solución</button><button class="s" onclick="clr()">Limpiar</button><b id="sc"></b></div>`+o.join('')}
function chk(){let ok=0,n=0;document.querySelectorAll('[data-e]').forEach(i=>{n++;const v=parseFloat(i.value.replace(/[,\s$]/g,'')),e=+i.dataset.e,g=!isNaN(v)&&Math.abs(v-e)<=Math.max(.02,Math.abs(e)*.003);i.className=g?'ok':i.value?'er':'';ok+=g});$('#sc').textContent=ok+' / '+n+' correctas'}
function sol(){document.querySelectorAll('[data-e]').forEach(i=>i.value=+(+i.dataset.e).toFixed(2));chk()}
function clr(){document.querySelectorAll('[data-e]').forEach(i=>{i.value='';i.className=''});$('#sc').textContent=''}
let p,c,P;
function load(x){P=p=x;c=calc(p);$('#tP').innerHTML=`<div class="card"><div class="row"><b>${p.n}</b><button class="s" onclick="load(P1)">Ejercicio 1</button><button class="s" onclick="load(P2)">Ejercicio 2</button><button onclick="load(gen())">Nuevo aleatorio</button></div><p class="mu">Los datos del aleatorio cambian cada vez: el inventario final deseado puede quedar arriba o abajo del inicial, y el G.I.F. total siempre es de 6 dígitos. Las cédulas están vacías: todo lo calculas tú.</p><pre>${txt(p)}</pre></div>`;$('#tC').innerHTML=ced()}
$('#tA').innerHTML=`<div class="card"><h3>Cómo se resuelve, paso a paso</h3><ol><li><b>Ventas (1):</b> unidades × precio de cada semestre.</li><li><b>Producción (2):</b> ventas + inventario final − inventario inicial. Si el final es mayor que el inicial, produces más de lo que vendes; si es menor, produces menos. Como el enunciado pide el mismo inventario final cada semestre, el inicial del S2 es el final del S1, y por eso en el S2 la producción sale igual a las ventas.</li><li><b>Materia prima (3):</b> producción × kg por unidad, separado por AA y BB, y × costo por kg del semestre.</li><li><b>Compras (4):</b> requerimiento + inventario final − inventario inicial de la materia prima. Misma lógica que la producción, pero en kg.</li><li><b>MOD (5):</b> producción × horas por unidad × tarifa del semestre.</li><li><b>G.I.F. (6):</b> sumas los conceptos, divides entre todas las horas de MOD y obtienes la cuota por hora. Aplicado = horas × cuota.</li><li><b>Gastos de venta y admin (7):</b> suma simple.</li><li><b>Inventario final (8):</b> costo unitario de cada producto (MP + MOD + G.I.F.) × unidades finales.</li><li><b>Costo de ventas (9):</b> costo de producción + inventario inicial P.T. − inventario final P.T.</li><li><b>Resultados (10):</b> ventas − costo de ventas − gastos de operación.</li></ol><p><b>Orden recomendado:</b> 1 → 2 → 3 → 4 → 5 → 6 → 8 → 9 → 10 (la 7 va en cualquier momento antes de la 10).</p><p><b>Trampas típicas:</b> usar el inventario inicial del S1 también en el S2; olvidar cambiar la tarifa de MOD o el costo por kg en el S2; dividir el G.I.F. entre las horas de un solo semestre; restar el inventario final de materia prima en vez de sumarlo en las compras.</p><p><b>Comprobación rápida:</b> la suma del G.I.F. aplicado de la cédula 6 tiene que dar exactamente el total de G.I.F. Si no, hay un error en las horas.</p><p class="mu">Al revisar, se acepta una diferencia mínima por redondeo de la cuota (0.3 %). En cada cédula, “Cómo se hace” te da la fórmula si te atoras.</p></div>`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));['P','C','A'].forEach(t=>$('#t'+t).hidden=t!==b.dataset.t)});
load(P1);
</script></body></html>
