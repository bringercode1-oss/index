const $=s=>document.querySelector(s),sum=a=>a.reduce((x,y)=>x+y,0),P=['Z','Y'],M=['AA','BB'];

const tr=(x,n)=>Math.floor(x*10**n+1e-6)/10**n,r2=x=>Math.round((x+Number.EPSILON)*100)/100;
function C(d){const o={v:{},pr:{},hr:{},md:{},rq:{},by:{},uc:{},fi:{}};
P.forEach(p=>{o.v[p]=[0,1].map(s=>d.u[p][s]*d.pr[p][s]);o.pr[p]=[d.u[p][0]+d.pt[p].if-d.pt[p].ii,d.u[p][1]];o.hr[p]=o.pr[p].map(q=>q*d.req[p].h);o.md[p]=o.hr[p].map((h,s)=>h*d.rate[s])});
M.forEach(m=>{const x=d.mp[m];o.rq[m]=[0,1].map(s=>sum(P.map(p=>o.pr[p][s]*d.req[p][m])));o.by[m]=[o.rq[m][0]+x.if-x.ii,o.rq[m][1]]});
o.th=sum(P.map(p=>sum(o.hr[p])));o.gif=sum(d.gif.map(x=>x[1]));o.gva=sum(d.gva.map(x=>x[1]));o.gr=tr(o.gif/o.th,6);o.gu={};o.ga={};
P.forEach(p=>{o.gu[p]=tr(d.req[p].h*o.gr,2);o.ga[p]=o.hr[p].map(x=>tr(x*o.gr,2));o.uc[p]=r2(sum(M.map(m=>d.req[p][m]*d.mp[m].c[1]))+d.req[p].h*d.rate[1]+o.gu[p]);o.fi[p]=r2(d.pt[p].if*o.uc[p])});o.gat=r2(sum(P.map(p=>sum(o.ga[p]))));o.gd=r2(o.gif-o.gat);
o.mpu=sum(M.map(m=>sum([0,1].map(s=>o.rq[m][s]*d.mp[m].c[s]))));o.mod=sum(P.map(p=>sum(o.md[p])));o.cp=o.mpu+o.mod+o.gif;o.ifi=r2(sum(P.map(p=>o.fi[p])));o.cv=r2(o.cp+d.ptI-o.ifi);o.vt=sum(P.map(p=>sum(o.v[p])));o.ub=r2(o.vt-o.cv);o.ut=r2(o.ub-o.gva);return o}
function rng(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(seed){const r=rng(seed),ri=(a,b,k=1)=>a+Math.floor(r()*((b-a)/k+1))*k;
const req={Z:{AA:ri(3,10),BB:ri(1,6),h:ri(1,6)},Y:{AA:ri(3,10),BB:ri(0,5),h:ri(1,8)}},ca=ri(3,18),cb=ri(2,14),
mp={AA:{ii:ri(500,3000,100),c:[ca,ca+ri(1,3)]},BB:{ii:ri(300,2000,100),c:[cb,cb+ri(1,3)]}};M.forEach(m=>mp[m].if=mp[m].ii+ri(200,1500,100));
const pt={Z:{ii:ri(100,300,10)},Y:{ii:ri(100,300,10)}};P.forEach(p=>pt[p].if=ri(50,400,10));
const pz=ri(120,600,10),py=ri(80,400,10),pr={Z:[pz,pz+ri(5,40,5)],Y:[py,py+ri(5,30,5)]},
u={Z:[ri(2000,12000,500),ri(2000,14000,500)],Y:[ri(2000,15000,500),ri(2000,15000,500)]},rt=ri(8,30);
const d={ptI:ri(10,60)*1000,req,rate:[rt,rt+ri(2,4)],mp,pt,pr,u,gif:[],gva:[]},o=C(d),tot=ri(8,30)*o.th,
sp=(T,f,L)=>{let a=0;return L.map((n,i)=>{const v=i<L.length-1?Math.round(T*f[i]/1000)*1000:T-a;a+=v;return[n,v]})};
d.gif=sp(tot,[.10,.39,.20,.14,.08],['Depreciación','Supervisión','Seguro','Mantenimiento','Accesorios','Energéticos']);
const g=ri(200,800,10)*1000;d.gva=sp(g,[.35,.10,.30,.08,.07],['Sueldos','Comisiones','Publicidad','Accesorios','Depreciación','Varios']);d.n='Aleatorio #'+seed;return d}

const GUIDE=`<div class=card><h2><span>Cómo estudiar este tema</span></h2>
<p>El presupuesto de operación es una <b>cadena</b>: cada cédula usa resultados de la anterior. Si entiendes de dónde sale cada número, ya no memorizas, deduces.</p>
<p class=mu>Flujo: Ventas → Producción → Requerimiento de MP → Compras · Producción → MOD → GIF → Valuación de inventario → Costo de producción → Costo de ventas → Estado de resultados.</p>
<p><b>Ruta sugerida:</b> 1) lee cada paso abajo, 2) resuelve el Ejercicio 1 en modo Práctica, 3) pulsa «Problema aleatorio» y repite hasta resolver sin ver respuestas, 4) imprime la plantilla en blanco y practica a mano.</p></div>
${[
['1. Ventas','Unidades × precio, por semestre y producto. Es el punto de partida de todo.','Total = suma de los dos semestres.','Usar el precio del semestre equivocado.'],
['2. Producción (unidades)','Producción = ventas + inventario final deseado − inventario inicial.','El inventario inicial del S2 es el final del S1. El inventario inicial del S1 viene en el enunciado.','Olvidar que el inv. inicial del S2 ya no es el dato original.'],
['3. Requerimiento de MP','Producción de cada producto × kg por unidad, para AA y BB, por semestre.','Se multiplica por la producción, no por las ventas. Total kg × costo por kg del semestre.','Usar ventas en vez de producción; costo del semestre equivocado.'],
['4. Compras de MP','Compras = requerimiento + inv. final deseado − inv. inicial (kg), y luego × costo por kilo.','Mismo principio que producción, pero con kilos de materia prima.','Mezclar el inv. de MP con el de producto terminado.'],
['5. Mano de obra directa','Producción × horas por unidad = horas. Horas × costo por hora del semestre = costo MOD.','La tarifa cambia entre S1 y S2. El total de horas se usa después en GIF.','Usar la tarifa de un solo semestre.'],
['6. GIF','Cuota = GIF anuales ÷ horas totales de MOD (todos los semestres y productos). GIF aplicado = horas × cuota.','La cuota se trunca a 6 decimales; por eso puede haber una pequeña diferencia de centavos.','Dividir entre horas de un solo semestre.'],
['7. Gastos de venta y admón.','Es solo la suma de los conceptos que da el enunciado. No entra al costo de producción.','Va directo al estado de resultados.','Meterlos al costo del producto.'],
['8. Valuación de inventarios','Costo unitario = MP AA + MP BB + MOD + GIF por unidad, con costos del <b>S2</b> (fin de año). Costo del inventario final = unidades finales × costo unitario.','El GIF por unidad = horas por unidad × cuota.','Usar costos del S1.'],
['9. Costo de producción y de ventas','Costo de producción = MP usada + MOD + GIF. Costo de ventas = costo de producción + inv. inicial P.T. − inv. final P.T.','La MP usada es la de las cédulas 3 (kg × costo), no las compras.','Usar compras en lugar de MP utilizada.'],
['10. Estado de resultados','Utilidad bruta = ventas − costo de ventas. Utilidad = utilidad bruta − gastos de venta y administración.','Es el cierre: sirve para verificar que todo encadenó bien.','Restar los GIF otra vez.']
].map(x=>`<details class=card><summary>${x[0]}</summary><ul><li><b>Qué se calcula:</b> ${x[1]}</li><li><b>De dónde salen los datos:</b> ${x[2]}</li><li class=er><b>Error típico:</b> ${x[3]}</li></ul></details>`).join('')}
<div class=card><h2><span>Mini autoevaluación</span></h2><ul><li>¿Por qué el inv. inicial del S2 es el final del S1?</li><li>¿Por qué la MP utilizada ≠ compras?</li><li>¿Qué costos se usan para valuar el inventario final y por qué?</li><li>¿Por qué los gastos de venta no entran al costo del producto?</li></ul><p class=mu>Respuestas: continuidad de inventarios; compras ajustan inventario de MP; porque el inventario final es de fin de año; son gastos del periodo, no costo de producción.</p></div>`;
const E={
1:{n:'Ejercicio 1',ptI:250000,req:{Z:{AA:5,BB:3,h:4},Y:{AA:7,BB:3,h:7}},rate:[25,29],mp:{AA:{ii:1200,if:2500,c:[15,17]},BB:{ii:700,if:2000,c:[12,14]}},pt:{Z:{ii:150,if:300},Y:{ii:220,if:350}},pr:{Z:[500,600],Y:[320,360]},u:{Z:[4000,5000],Y:[2800,3200]},gif:[['Depreciación',190000],['Supervisión',750000],['Seguro',385000],['Mantenimiento',270000],['Accesorios',150000],['Energéticos',170000]],gva:[['Sueldos',250000],['Comisiones',70000],['Publicidad',210000],['Accesorios',55000],['Depreciación',50000],['Varios',80000]]},

function tables(d,o){const K=[['Z',0],['Y',0],['Z',1],['Y',1]],nm=p=>'Producto '+p,T=[];

['Necesidad de producción',...K.map(([p,s])=>c(d.u[p][s]+d.pt[p].if,'u'))],['(−) Inventario inicial',...K.map(([p,s])=>s?c(d.pt[p].if,'u'):g(d.pt[p].ii,'u'))],

['Total kg',null,null,c(o.rq.AA[s],'k'),null,null,c(o.rq.BB[s],'k'),null],['Costo/kg',null,null,g(d.mp.AA.c[s],'m'),null,null,g(d.mp.BB.c[s],'m'),null],
['Gran total',null,null,c(o.rq.AA[s]*d.mp.AA.c[s],'m'),null,null,c(o.rq.BB[s]*d.mp.BB.c[s],'m'),c(sum(M.map(m=>o.rq[m][s]*d.mp[m].c[s])),'m')]]}));

['Requerimiento de MP (kg)',...KM.map(([m,s])=>c(o.rq[m][s],'k'))],['(+) Inventario final deseado',...KM.map(([m])=>g(d.mp[m].if,'k'))],['Necesidad de compra',...KM.map(([m,s])=>c(o.rq[m][s]+d.mp[m].if,'k'))],

['Total horas requeridas',...K.map(([p,s])=>c(o.hr[p][s],'u')),c(o.th,'u')],['Costo por hora',...K.map(([p,s])=>g(d.rate[s],'m')),null],['Total costo MOD',...K.map(([p,s])=>c(o.md[p][s],'m')),c(o.mod,'m')]]});

function enun(d){const f=fmt,q=d.req,m=d.mp,t=d.pt,r=d.pr,u=d.u;return`<details class=card open><summary>Enunciado (formato examen) — para copiar o imprimir</summary><div style="line-height:1.7">
<p>Se pide preparar el presupuesto de operación para el 2027. Inventario P.T.: ${f(d.ptI)}.</p>
<p><b>Requerimientos:</b> Tipo Z: AA ${q.Z.AA} kg, BB ${q.Z.BB} kg, ${q.Z.h} h MOD. Tipo Y: AA ${q.Y.AA} kg, BB ${q.Y.BB} kg, ${q.Y.h} h MOD.</p>
<p>Los gastos indirectos de fabricación se aplican con base en horas de mano de obra directa. El costo de la mano de obra es de ${d.rate[0]} la hora el primer semestre y ${d.rate[1]} el segundo.</p>
<p><b>Inventarios:</b> MP AA: inicial ${f(m.AA.ii)}, final deseado ${f(m.AA.if)}, costo ${m.AA.c[0]} / ${m.AA.c[1]} por kg. MP BB: inicial ${f(m.BB.ii)}, final deseado ${f(m.BB.if)}, costo ${m.BB.c[0]} / ${m.BB.c[1]} por kg. Tipo Z: inicial ${t.Z.ii}, final ${t.Z.if}. Tipo Y: inicial ${t.Y.ii}, final ${t.Y.if}. Se desea tener la misma cantidad de inventario final cada semestre.</p>
<p><b>Precios (S1 / S2):</b> Z ${r.Z[0]} / ${r.Z[1]}; Y ${r.Y[0]} / ${r.Y[1]}. <b>Ventas (unidades):</b> Z ${f(u.Z[0])} / ${f(u.Z[1])}; Y ${f(u.Y[0])} / ${f(u.Y[1])}.</p>
<p>Los inventarios en proceso tienen poca importancia. GIF 2027: ${d.gif.map(x=>x[0]+' '+f(x[1])).join('; ')}. Total ${f(sum(d.gif.map(x=>x[1])))}.</p>
<p>Gastos de administración y ventas 2027: ${d.gva.map(x=>x[0]+' '+f(x[1])).join('; ')}. Total ${f(sum(d.gva.map(x=>x[1])))}.</p></div></details>`}
function datos(d){const r=(a,b)=>`<tr><th class=l>${a}</th>${b.map(x=>`<td class=n>${fmt(x)}</td>`).join('')}</tr>`;
return enun(d)+`<div class=card><h2><span>Datos del ${esc(d.n)} — presupuesto de operación 2027</span></h2><div class=g2>
<div class=sc><table><tr><th>Requerimiento</th><th>Z</th><th>Y</th></tr>${r('MP AA (kg)',[d.req.Z.AA,d.req.Y.AA])}${r('MP BB (kg)',[d.req.Z.BB,d.req.Y.BB])}${r('Horas MOD',[d.req.Z.h,d.req.Y.h])}</table>
<p class=mu>GIF se aplican con base en horas de MOD. Costo MOD por hora: ${d.rate[0]} (S1) y ${d.rate[1]} (S2). Inventario inicial P.T.: ${fmt(d.ptI)}. Inventario final = mismo cada semestre.</p></div>
<div class=sc><table><tr><th>Materia prima</th><th>Inv. inicial</th><th>Inv. final</th><th>Costo S1</th><th>Costo S2</th></tr>${M.map(m=>r(m,[d.mp[m].ii,d.mp[m].if,...d.mp[m].c])).join('')}</table>
<table><tr><th>Producto</th><th>Inv. inicial</th><th>Inv. final</th><th>Precio S1</th><th>Precio S2</th><th>Unid. S1</th><th>Unid. S2</th></tr>${P.map(p=>r(p,[d.pt[p].ii,d.pt[p].if,...d.pr[p],...d.u[p]])).join('')}</table></div>
<div><b>GIF estimados</b>${li(d.gif)}</div><div><b>Gastos de venta y administración</b>${li(d.gva)}</div></div></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const FORM=`<details class=card><summary>Fórmulas clave (cómo se encadena todo)</summary><ul>
<li><b>Producción</b> = ventas + inv. final deseado − inv. inicial (el inv. inicial del S2 es el final del S1).</li>
<li><b>Requerimiento de MP</b> = producción × kg por unidad; <b>compras</b> = requerimiento + inv. final − inv. inicial.</li>
<li><b>MOD</b> = producción × horas por unidad × costo por hora del semestre.</li>
<li><b>Cuota de GIF</b> = GIF anuales ÷ horas totales de MOD (ambos semestres, ambos productos), truncada a 6 decimales (sin redondear hacia arriba). <b>GIF aplicado</b> = horas × cuota; el GIF por unidad se trunca a centavos.</li>
<li><b>Costo unitario</b> = MP AA + MP BB + MOD + GIF por unidad (costos del S2, el inventario final es de fin de año).</li>
<li><b>Costo de ventas</b> = costo de producción + inv. inicial P.T. − inv. final P.T. (cédula 8).</li>
<li><b>Utilidad</b> = ventas − costo de ventas − gastos de venta y administración.</li></ul>
<p class=mu>La revisión es exacta al centavo (cuota truncada a 6 decimales, GIF por unidad truncado a 2).</p></details>`;
function exb(){$('#ex').innerHTML=[['g','Guía de estudio'],['1','Ejercicio 1'],['2','Ejercicio 2'],['r','Problema aleatorio']].map(x=>`<button data-ex=${x[0]} class="${st.ex==x[0]?'on':''}">${x[1]}</button>`).join('')+(st.ex=='r'?'<button data-new>Nuevo problema ↻</button>':'')}
function render(){exb();if(st.ex=='g'){$('#md').innerHTML=$('#ac').innerHTML='';$('#app').innerHTML=GUIDE;return}const d=st.ex=='r'?gen(st.seed):E[st.ex],o=C(d),T=tables(d,o);

$('#md').innerHTML=[['p','Práctica'],['c','Completo']].map(x=>`<button data-md=${x[0]} class="${st.mode==x[0]?'on':''}">${x[1]}</button>`).join('');
$('#ac').innerHTML=st.mode=='p'?'<button data-all>Revisar todo</button><button data-clr>Limpiar</button> <span id="sc" class="mu"></span>':'';
$('#app').innerHTML=datos(d)+T.map((t,i)=>`<div class=card data-i=${i}><h2><span>${t.t}</span>${st.mode=='p'?'<button data-chk>Revisar</button><button data-rv>Ver respuesta</button>':''}</h2>${(t.parts||[t]).map(q=>`${q.cap?`<p class=mu><b>${q.cap}</b></p>`:''}<div class=sc><table>${q.head}${q.rows.map(r=>`<tr>${r.map(cell).join('')}</tr>`).join('')}</table></div>`).join('')}</div>`).join('')+FORM}
const pn=s=>{s=s.replace(/[$,\s]/g,'');return s===''||isNaN(s)?null:+s};
function chk(scope){let a=0,b=0;scope.querySelectorAll('input').forEach(i=>{const v=+i.dataset.v,x=pn(i.value);i.classList.remove('ok','er','rv');if(x===null)return;b++;if(Math.abs(x-v)<=(i.dataset.t=='r'?0.0000015:0.011)){i.classList.add('ok');a++}else i.classList.add('er')});return[a,b]}
function sc(){const a=chk($('#app'));const t=document.querySelectorAll('#app input').length;$('#sc').textContent=`${a[0]} correctas de ${t} (${a[1]} capturadas)`}
document.addEventListener('click',e=>{const t=e.target,k=t.closest('[data-i]');
if(t.dataset.ex){st.ex=t.dataset.ex;render()}else if(t.dataset.md){st.mode=t.dataset.md;render()}else if('new' in t.dataset){st.seed=1+Math.floor(Math.random()*99999);render()}
else if('all' in t.dataset)sc();else if('clr' in t.dataset){document.querySelectorAll('#app input').forEach(i=>{i.value='';i.className=''});$('#sc').textContent=''}
else if('chk' in t.dataset)chk(k);else if('rv' in t.dataset){k.querySelectorAll('input').forEach(i=>{i.value=fmt(+i.dataset.v,i.dataset.t);i.className='rv'})}
else if(t.id=='th'){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark'}});
render();
</script></body></html>
